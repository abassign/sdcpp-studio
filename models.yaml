# sdcpp-studio - model registry
# -----------------------------------------------------------------------------
# Define WHAT the app needs and let `./go.sh setup` / `./go.sh download <preset>`
# fetch it. Model WEIGHTS are never committed and never baked into the image:
# they live in a mounted volume (MODELS_DIR).
#
# Schema (per entry):
#   id:         stable key (also the target subfolder under MODELS_DIR)
#   kind:       diffusion | vae | text_encoder | llm | lora
#   repo:       Hugging Face repo id (owner/name)   <- TODO = not verified yet
#   file:       file/glob inside the repo (allow_patterns)
#   target:     subfolder under MODELS_DIR (checkpoints | vae | text_encoders | i2t | loras)
#   size_gb:    approximate download size (disk pre-flight)
#   license:    model license (shown to the user; weights are NOT redistributed)
#   gated:      needs an HF token / license acceptance
#   required_by:[preset ids]
#
# Entries marked TODO have unverified repo/file values: fill them before release.
# -----------------------------------------------------------------------------
version: 1

components:

  # ===== diffusion checkpoints (GGUF) =====
  z-image-turbo:
    kind: diffusion
    repo: leejet/Z-Image-Turbo-GGUF
    file: "z_image_turbo-Q6_K.gguf"
    target: checkpoints
    size_gb: 4.9
    license: see model card
    required_by: [default]

  ideogram4:
    kind: diffusion
    repo: leejet/ideogram-4-GGUF
    file: "ideogram4-Q4_0.gguf"
    target: checkpoints
    size_gb: 5.3
    license: Ideogram License
    required_by: [ideogram4]

  ideogram4-uncond:
    kind: diffusion
    repo: leejet/ideogram-4-GGUF
    file: "ideogram4_uncond-Q4_0.gguf"
    target: checkpoints
    size_gb: 5.3
    license: Ideogram License
    required_by: [ideogram4]

  qwen-image-2.1:
    kind: diffusion
    repo: leejet/Qwen-Image-2.1-GGUF
    file: "qwen_image_2.1-Q6_K.gguf"
    target: checkpoints
    size_gb: 5.6
    license: Apache-2.0
    required_by: [qwen21]

  flux1-dev:
    kind: diffusion
    repo: unsloth/FLUX.1-dev-GGUF
    file: "flux1-dev-Q4_K_S.gguf"
    target: checkpoints
    size_gb: 7
    license: FLUX.1 [dev] Non-Commercial
    gated: true
    required_by: [flux]

  # ===== VAE =====
  vae-flux:
    kind: vae
    repo: black-forest-labs/FLUX.1-dev
    file: "ae.safetensors"
    target: vae
    size_gb: 0.32
    license: FLUX.1 [dev] Non-Commercial
    gated: true
    required_by: [flux]

  vae-flux2:
    kind: vae
    repo: TODO            # FLUX.2 VAE (used by Ideogram 4 too)
    file: "flux2-vae.safetensors"
    target: vae
    size_gb: 0.32
    license: TODO
    required_by: [ideogram4]

  vae-zimage:
    kind: vae
    repo: TODO            # zImage_vae.safetensors
    file: "zImage_vae.safetensors"
    target: vae
    size_gb: 0.32
    license: TODO
    required_by: [default]

  vae-qwen21:
    kind: vae
    repo: TODO            # qwen_image_2.1_vae_bf16.safetensors
    file: "*vae*.safetensors"
    target: vae
    size_gb: 0.64
    license: Apache-2.0
    required_by: [qwen21]

  # ===== text encoders =====
  clip-l:
    kind: text_encoder
    repo: comfyanonymous/flux_text_encoders
    file: "clip_l.safetensors"
    target: text_encoders
    size_gb: 0.25
    license: see repo
    required_by: [flux]

  t5xxl:
    kind: text_encoder
    repo: comfyanonymous/flux_text_encoders
    file: "t5xxl_fp16.safetensors"
    target: text_encoders
    size_gb: 9.1
    license: Apache-2.0
    required_by: [flux]

  qwen-zimage-encoder:
    kind: text_encoder
    repo: TODO            # qwen_zimage_text_encoder.gguf
    file: "qwen*zimage*text*encoder*.gguf"
    target: text_encoders
    size_gb: 7.5
    license: TODO
    required_by: [default]

  qwen3-vl-8b:
    kind: text_encoder
    repo: TODO            # qwen3-vl-8b-instruct-q4_k_m.gguf (Ideogram 4 encoder)
    file: "qwen3-vl-8b-instruct-q4_k_m.gguf"
    target: text_encoders
    size_gb: 4.7
    license: Apache-2.0
    required_by: [ideogram4]

  # ===== LLM / VLM (I2T, critic, translator) =====
  qwen3vl-4b-abliterated:
    kind: llm
    repo: TODO            # GGUF conversion, e.g. mradermacher/Huihui-Qwen3-VL-4B-Instruct-abliterated-GGUF
    file: "*Q4_K_M.gguf"
    target: i2t
    size_gb: 2.3
    license: Apache-2.0 (abliterated derivative - check terms)
    required_by: [default, flux, ideogram4, qwen21]

presets:
  # Modern default on a 24 GB AMD/NVIDIA GPU: Z-Image-Turbo + a small VLM.
  default:
    description: "Z-Image-Turbo + Qwen3-VL-4B (I2T/critic/translator)."
    components: [z-image-turbo, vae-zimage, qwen-zimage-encoder, qwen3vl-4b-abliterated]
  flux:
    description: "FLUX.1-dev (T2I + inpaint via --mask)."
    components: [flux1-dev, vae-flux, clip-l, t5xxl, qwen3vl-4b-abliterated]
  ideogram4:
    description: "Ideogram 4 (best text rendering) + Qwen3-VL encoder."
    components: [ideogram4, ideogram4-uncond, vae-flux2, qwen3-vl-8b, qwen3vl-4b-abliterated]
  qwen21:
    description: "Qwen-Image 2.1."
    components: [qwen-image-2.1, vae-qwen21, qwen3vl-4b-abliterated]
